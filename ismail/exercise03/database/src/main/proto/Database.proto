syntax = "proto3";

package database;

option java_multiple_files = true;
option java_package = "ismail.exercise03.database.protocol";

message DatabaseRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    GET_RECORD = 1;
    ADD_RECORD = 2;
    GET_SIZE = 3;
  }

  Operation operation = 1;
  int32 index = 2;
  string record = 3;
}

message DatabaseResponse {
  bool success = 1;
  string error = 2;
  string record = 3;
  int32 size = 4;
}
