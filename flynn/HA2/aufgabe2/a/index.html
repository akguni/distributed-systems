<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Mein Server</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: regenbogen 3s linear infinite;
        }

        p {
            color: white;
            font-family: sans-serif;
            font-size: 3rem;
            text-shadow: 0 0 4px black;
        }

        @keyframes regenbogen {
            0%   { background: hsl(0, 100%, 50%); }
            17%  { background: hsl(60, 100%, 50%); }
            33%  { background: hsl(120, 100%, 50%); }
            50%  { background: hsl(180, 100%, 50%); }
            67%  { background: hsl(240, 100%, 50%); }
            83%  { background: hsl(300, 100%, 50%); }
            100% { background: hsl(360, 100%, 50%); }
        }

        /* wer keine bewegung möchte, bekommt eine feste farbe */
        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
                background: hsl(200, 100%, 50%);
            }
        }
    </style>
</head>
<body>
    <p>Seid gegrüßt, Reisender.</p>
</body>
</html>
